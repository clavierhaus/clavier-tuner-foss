# codemagic.yaml -- Clavier Tuner on the iPhone to TestFlight, on Codemagic's Mac (Peter, 23 Nov 2026, 22:35: "Now I would
# like to try out my new ios build service at Codemagic and prepare an actual release in the app store").
#
# The steps are build.yml's jobs testflight and testflight-testers, unchanged: the same framework, the same Xcode project,
# the same automatic signing by the App Store Connect key, the same upload. What to Test and the tester groups are not done
# here: Apple's processing takes up to an hour (0.10.0, 18 Nov 2026), and a Mac waiting for it burns the month's 500
# minutes, so release-ios.sh runs scripts/testflight.py on the X1 once the upload is done. build.yml keeps its jobs.
#
# Nothing starts by itself: no trigger. scripts/release-ios.sh starts a workflow through Codemagic's API after Peter's
# yes on Android, as it started build.yml.
#
# The secrets live in Codemagic, in the environment group "app_store_connect" of this app, all four secure:
#   APPLE_TEAM_ID   the team
#   ASC_KEY_ID      the key's ID
#   ASC_ISSUER_ID   the team's issuer
#   ASC_KEY_P8      the .p8's text, or the same base64-encoded on one line
#
# The build number: 1000 + Codemagic's own count of this workflow's builds, above every number GitHub's runs gave
# (100 + the run number).

definitions:
  key: &key
    name: The App Store Connect key, for this build only
    script: |
      for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
        test -n "${!v:-}" || { echo "missing $v in Codemagic's group app_store_connect"; exit 1; }
      done
      mkdir -p "$CM_BUILD_DIR/.keys"
      KEY="$CM_BUILD_DIR/.keys/AuthKey_$ASC_KEY_ID.p8"
      case "$ASC_KEY_P8" in
        *"BEGIN PRIVATE KEY"*) printf '%s\n' "$ASC_KEY_P8" > "$KEY" ;;
        *) printf '%s' "$ASC_KEY_P8" | base64 --decode > "$KEY" ;;
      esac
      grep -q "BEGIN PRIVATE KEY" "$KEY" || { echo "ASC_KEY_P8 is neither a .p8 nor one in base64"; exit 1; }
      echo "KEY=$KEY" >> "$CM_ENV"

workflows:
  foss-testflight:
    name: Clavier Tuner to TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 75
    environment:
      groups:
        - app_store_connect
      java: 21
      xcode: latest
    cache:
      cache_paths:
        - ~/.konan
        - ~/.gradle/caches
        - ~/.gradle/wrapper
    scripts:
      - *key
      - name: The screens as a framework for the iPhone
        script: ./gradlew --no-daemon :ui:linkReleaseFrameworkIosArm64
      - name: The Xcode project from iosApp/project.yml
        script: |
          command -v xcodegen >/dev/null || brew install xcodegen
          cd iosApp && xcodegen generate
      - name: The property lists are valid
        script: plutil -lint iosApp/iosApp/PrivacyInfo.xcprivacy
      # automatic signing archives with the development identity; the export re-signs it for the App Store (build.yml)
      - name: The archive, signed by Apple's automatic signing
        script: |
          BUILD=$((1000 + BUILD_NUMBER))
          echo "build $BUILD"
          echo "BUILD=$BUILD" >> "$CM_ENV"
          cd iosApp
          xcodebuild -project ClavierTuner.xcodeproj -scheme ClavierTuner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ClavierTuner.xcarchive \
            -allowProvisioningUpdates -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Development" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$BUILD" \
            archive
      - name: Signed for the App Store and uploaded to TestFlight
        script: |
          cd iosApp
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/ClavierTuner.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates -authenticationKeyPath "$KEY" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: The key removed
        script: rm -rf "$CM_BUILD_DIR/.keys"
