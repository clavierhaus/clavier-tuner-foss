# The iPhone app: a shell that shows the screens of the ui module (Compose Multiplatform), linked as the static
# framework ClavierTuner (31 Oct 2026). XcodeGen makes the Xcode project from this file on GitHub's macOS machines;
# the project itself is never committed. Signing is left to whoever installs the app (TestFlight later; for now a
# sideloading tool signs the unsigned .ipa with the tuner's own Apple ID).
name: ClavierTuner
options:
  bundleIdPrefix: at.clavierhaus
  deploymentTarget:
    iOS: "16.0"
targets:
  ClavierTuner:
    type: application
    platform: iOS
    sources:
      - iosApp
      # the faces and the hub's photograph: the same files as Android's res/, carried into the app's bundle
      # (2 Nov 2026) and read by ui's PlatformParts.ios.kt; nothing is copied into this folder
      - path: ../ui/src/androidMain/res/font
        buildPhase: resources
      - path: ../ui/src/androidMain/res/raw
        buildPhase: resources
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: Clavier Tuner
        # the version as Android names it; the build number is raised by every upload to TestFlight (build.yml)
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSMicrophoneUsageDescription: "Clavier Tuner listens to the string you strike to measure it. Nothing is recorded or sent."
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CADisableMinimumFrameDurationOnPhone: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: at.clavierhaus.claviertuner
        MARKETING_VERSION: "0.9.0"
        CURRENT_PROJECT_VERSION: "16"
        # the icon (Peter, 8 Nov 2026): "Clavier" over "Tuner" in DejaVu Serif, white on black, the vie in orange
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # the app's own Swift module must not share the framework's name, or `import ClavierTuner` is ignored
        PRODUCT_MODULE_NAME: ClavierTunerApp
        # the iPhone and the iPad, one app on every screen (CLAUDE.md, Peter, 2 Nov 2026: "For the customer
        # management, an iPad is much more suitable than an iPhone")
        TARGETED_DEVICE_FAMILY: "1,2"
        FRAMEWORK_SEARCH_PATHS: "$(SRCROOT)/../ui/build/bin/iosArm64/releaseFramework"
        OTHER_LDFLAGS: ["-framework", "ClavierTuner", "-lc++"]
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
        ENABLE_BITCODE: "NO"
