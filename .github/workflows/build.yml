# Every push builds the engine for Android and for iOS and runs the same tests on both;
# a red build on either platform is a broken build.
#
#   android: the core suite on the JVM, the screens' tests, and the APK itself.
#   ios:     the engine compiled for every iOS target and the core suite run on the iOS
#            simulator. Apple's toolchain runs only on macOS, so this job runs on GitHub's
#            macOS machines.

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Core suite (JVM)
        run: ./gradlew --no-daemon :shared:testAndroidHostTest
      # LayoutCheckTest draws the screens from the recordings, which never come to foss: here it says
      # "nothing drawn, nothing checked" and passes. The screens are drawn and checked in Pro's CI.
      - name: Screens' tests (the layout check draws in Pro's CI only)
        run: ./gradlew --no-daemon :ui:testDebugUnitTest
      - name: APK
        run: ./gradlew --no-daemon :androidApp:assembleDebug
      - name: Tests counted
        if: always()
        run: python3 scripts/test-count.py shared ui
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            shared/build/reports/tests
            ui/build/reports/tests

  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin/Native toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Engine for iPhone and simulators
        run: ./gradlew --no-daemon :shared:compileKotlinIosArm64 :shared:compileKotlinIosX64 :shared:compileKotlinIosSimulatorArm64
      - name: Core suite on the iOS simulator
        run: ./gradlew --no-daemon :shared:iosSimulatorArm64Test
      - name: Tests counted
        if: always()
        run: python3 scripts/test-count.py shared
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: shared/build/reports/tests
