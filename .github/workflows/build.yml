# The engine for Android and for iOS, the same tests on both; a red build on either platform is a
# broken build.
#
#   android: on every push that changes code -- the core suite on the JVM, the screens' tests, and the
#            APK itself. A push of docs or texts alone starts nothing (paths-ignore below).
#   ios:     by hand only (Actions > build > Run workflow) -- the engine compiled for every iOS target
#            and the core suite and the screens' iPhone checks run on the iOS simulator. Apple's
#            toolchain runs only on macOS, so this job runs on GitHub's macOS machines.
#   ipa:     by hand only -- the iPhone app itself (iosApp/, the screens as one framework), built
#            unsigned for a device and kept as a download: ClavierTuner.ipa, signed by whoever installs it.
#   testflight: by hand only, and only when chosen in Run workflow -- the same app signed by Apple's
#            automatic signing with the App Store Connect key and uploaded to TestFlight (8 Nov 2026, Peter:
#            "let's work on getting it deployed on testflight"). Needs the repository's secrets APPLE_TEAM_ID,
#            ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (the .p8 file's text).
#
# Why by hand (Peter, 2 Nov 2026): "only when I decide that a new version needs to be churned out and
# that will only happen after I test android". The same rule as Pro's, whose free allowance the two
# Mac jobs had spent in two days by running on every push.

name: build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
  workflow_dispatch:
    inputs:
      testflight:
        description: "Also sign the iPhone app and upload it to TestFlight"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK platform 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - name: Core suite (JVM)
        run: ./gradlew --no-daemon :shared:testAndroidHostTest
      # LayoutCheckTest draws the screens from the recordings, which never come to foss: here it says
      # "nothing drawn, nothing checked" and passes. The screens are drawn and checked in Pro's CI.
      - name: Screens' tests (the layout check draws in Pro's CI only)
        run: ./gradlew --no-daemon :ui:testAndroidHostTest
      - name: APK
        run: ./gradlew --no-daemon :androidApp:assembleDebug
      - name: Tests counted
        if: always()
        run: python3 scripts/test-count.py shared ui
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            shared/build/reports/tests
            ui/build/reports/tests

  ios:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin/Native toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: Engine for iPhone and simulators
        run: ./gradlew --no-daemon :shared:compileKotlinIosArm64 :shared:compileKotlinIosX64 :shared:compileKotlinIosSimulatorArm64
      - name: Core suite on the iOS simulator
        run: ./gradlew --no-daemon --continue :shared:iosSimulatorArm64Test :ui:iosSimulatorArm64Test
      - name: Tests counted
        if: always()
        run: python3 scripts/test-count.py shared ui
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: |
            shared/build/reports/tests
            ui/build/reports/tests

  ipa:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin/Native toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: The screens as a framework for the iPhone
        run: ./gradlew --no-daemon :ui:linkReleaseFrameworkIosArm64
      - name: What the framework offers Swift
        run: grep -n "TunerEntry\|MainViewController" ui/build/bin/iosArm64/releaseFramework/ClavierTuner.framework/Headers/ClavierTuner.h | head -20
      - name: The Xcode project from iosApp/project.yml
        run: brew install xcodegen && cd iosApp && xcodegen generate
      - name: The app, unsigned, for a device
        run: |
          cd iosApp
          xcodebuild -project ClavierTuner.xcodeproj -scheme ClavierTuner -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: The .ipa
        run: |
          cd iosApp
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/ClavierTuner.app Payload/
          # the faces and the photograph went into the bundle (PlatformParts.ios.kt reads them from there)
          ls Payload/ClavierTuner.app/dejavu_serif.ttf Payload/ClavierTuner.app/dejavu_serif_bold.ttf \
             Payload/ClavierTuner.app/allura_regular.ttf Payload/ClavierTuner.app/hub_background.jpg
          zip -qry ClavierTuner.ipa Payload
          ls -la ClavierTuner.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ClavierTuner-ipa
          path: iosApp/ClavierTuner.ipa
          retention-days: 14

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin/Native toolchain cache
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - name: The four secrets are there
        run: |
          for v in TEAM KEY_ID ISSUER; do test -n "${!v}" || { echo "missing secret for $v"; exit 1; }; done
          test -n "${{ secrets.ASC_KEY_P8 }}" || { echo "missing secret ASC_KEY_P8"; exit 1; }
      - name: The App Store Connect key, for this run only
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8"
      - name: The screens as a framework for the iPhone
        run: ./gradlew --no-daemon :ui:linkReleaseFrameworkIosArm64
      - name: The Xcode project from iosApp/project.yml
        run: brew install xcodegen && cd iosApp && xcodegen generate
      # automatic signing archives with the development identity (forcing 'Apple Distribution' conflicts with it, the
      # second run of 8 Nov 2026), which needs a registered device: Peter's iPhone 15 Plus, registered that night; the
      # export re-signs the archive for the App Store
      - name: The archive, signed by Apple's automatic signing
        run: |
          cd iosApp
          # a build number above Android's versionCode and above every earlier upload: 100 + this run's number
          BUILD=$((100 + ${{ github.run_number }}))
          echo "build $BUILD"
          xcodebuild -project ClavierTuner.xcodeproj -scheme ClavierTuner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/ClavierTuner.xcarchive \
            -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            CODE_SIGNING_ALLOWED=YES CODE_SIGNING_REQUIRED=YES CODE_SIGN_STYLE=Automatic \
            CODE_SIGN_IDENTITY="Apple Development" DEVELOPMENT_TEAM="$TEAM" CURRENT_PROJECT_VERSION="$BUILD" \
            archive
      - name: Signed for the App Store and uploaded to TestFlight
        run: |
          cd iosApp
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/ClavierTuner.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$KEY_ID.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
      - name: The key removed
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
