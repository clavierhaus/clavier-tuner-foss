# Check 1 — the build that runs by itself.
#
# Two broken APKs reached Peter on 30 September 2026, each costing a piano day,
# because the cloud sandbox has no Android SDK and compiles none of androidApp
# or ui. Reading the code is not a check. A check is run.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  engine:
    name: the engine's own tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :shared:testAndroidHostTest

  apps:
    name: both apps compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      # the modules the sandbox cannot reach: the screen and everything drawn on it
      - run: ./gradlew --no-daemon :ui:compileDebugKotlin :androidApp:assembleDebug
